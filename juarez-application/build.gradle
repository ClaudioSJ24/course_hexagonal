dependencies {
    // Dependencias de la capa de aplicación
    implementation project(':juarez-common')
    implementation project(':juarez-domain')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.1.0'
    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-validation
    implementation("org.springframework.boot:spring-boot-starter-validation:4.1.0")

    // Source: https://mvnrepository.com/artifact/org.springframework.security/spring-security-core
    implementation("org.springframework.security:spring-security-core:7.1.0")

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-oauth2-resource-server
    implementation("org.springframework.boot:spring-boot-starter-oauth2-resource-server:4.1.0")

    // Source: https://mvnrepository.com/artifact/org.springframework.security/spring-security-oauth2-authorization-server
    implementation("org.springframework.security:spring-security-oauth2-authorization-server:7.1.0")

}